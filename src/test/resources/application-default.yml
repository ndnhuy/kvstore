server:
  port: 8101

spring:
  application.name: kvstore
  datasource:
    url: jdbc:mysql://localhost:6033/kvstore
    username: root
    password: root
    driver-class-name: com.mysql.jdbc.Driver
  jpa:
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5276
    username: guest
    password: guest
  docker:
    compose:
      skip:
        in-tests: false
      enabled: true
      file: docker-compose.yml

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org:
      hibernate:
        DEBUG
      # sql: debug
      # type:
      #   descriptor:
      #     sql: TRACE
